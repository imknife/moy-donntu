name: flutter_lab
description: "Мой ДонНТУ: неофициальное приложение с расписанием ДонНТУ"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.13.7

dependencies:
  file_picker: 13.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  lucide_icons_flutter: 4.0.1
  path_provider: 2.1.6
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/seed.json
    - assets/seed/teachers.json
    - assets/seed/seed-meta.json
  fonts:
    - family: LucideSubset
      fonts:
        - asset: assets/fonts/LucideSubset.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest_700Bold.ttf
          weight: 700
